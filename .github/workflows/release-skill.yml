name: Publish reviewer skill release

on:
  push:
    tags:
      - "v1.0.0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4

      - name: Use the pinned active Node LTS release
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install, package and verify
        run: |
          npm ci
          npm test
          npm run package:skill
          npm run build

      - name: Create the matching GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            public/downloads/eu-ai-act-reviewer-skill-v1.0.0.zip \
            public/downloads/eu-ai-act-reviewer-skill-v1.0.0.sha256 \
            public/downloads/eu-ai-act-reviewer-SKILL-v1.0.0.md \
            --verify-tag \
            --title "EU AI Act reviewer skill v1.0.0" \
            --notes "Portable, read-only EU AI Act issue-spotting skill for Codex and Claude Code. Educational use only; not legal advice."
